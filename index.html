<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Australia's Climate Chronicles: A Visual Exploration</title>
  <!-- Bootstrap -->
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
  <!-- jQueryUI styling -->
	<link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
  <!-- Custom styling -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Loading overlay -->
  <div id="loading-overlay">
    <p>Loading...</p>
  </div>

  <!-- Header band -->
  <header class="header-band">
    <div class="container-fluid">
      <h2>Australia's Climate Chronicles: A Visual Exploration</h2>
    </div>
  </header>

  <!-- Bootstrap grid setup -->
  <div class="container-fluid mb-1">
    <div id="vis-container" class="d-flex flex-column justify-content-center">
      <div class="row mb-1 d-flex justify-content-center same-width">
        <div class="col-md-7 d-flex justify-content-center align-items-end same-width">
          <button id="play-button" class="btn btn-primary">Play</button>
          <button id="reset-time-button" class="btn btn-primary">Reset</button>
          <div id="slider-div">
            <label for="date-slider" class="form-label">Date: <span id="dateLabel"></span></label>
            <div id="date-slider">
              <div class="ui-slider-range"></div>
            </div>
          </div>
        </div>
        <div class="col-md-4 d-flex justify-content-around align-items-end same-width">
          <div id="compare-city-1" class="city-selector">
            <label for="city-1" class="form-label">City 1:</label>
            <select id="city-1" name="city-1" required>
              <option value="5000">Adelaide</option>
              <option value="4000">Brisbane</option>
              <option value="2600">Canberra</option>
              <option value="0800">Darwin</option>
              <option value="7000">Hobart</option>
              <option value="3000" selected>Melbourne</option>
              <option value="6000">Perth</option>
              <option value="2000">Sydney</option>
            </select>
          </div>
          <div id="compare-city-2" class="city-selector">
            <label for="city-2" class="form-label">City 2:</label>
            <select id="city-2" name="city-2" required>
              <option value="5000">Adelaide</option>
              <option value="4000" selected>Brisbane</option>
              <option value="2600">Canberra</option>
              <option value="0800">Darwin</option>
              <option value="7000">Hobart</option>
              <option value="3000">Melbourne</option>
              <option value="6000">Perth</option>
              <option value="2000">Sydney</option>
            </select>
          </div>
        </div>
      </div>
      <div class="row mb-1 d-flex justify-content-between same-width">
          <div id="zoom-controls">
            <button id="zoom-in" class="btn btn-secondary">+</button>
            <button id="zoom-out" class="btn btn-secondary">-</button>
            <button id="reset-zoom" class="btn btn-secondary">⟳</button>
          </div>
          <div id="map"></div>
          <div id="legend"></div>
      </div>
    </div>
  <div id="tooltip-1"></div>
  <div id="tooltip-2"></div>

  <!-- External JS libraries -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://d3js.org/topojson.v1.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
  <!-- Custom JS -->
  <script src="js/main.js"></script>
</body>
</html>
